name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: python -m black --check can_tcp_gateway.py can_tcp_client.py tests
          - name: Code analysis
            command: python -m ruff check can_tcp_gateway.py can_tcp_client.py tests
          - name: Syntax and type baseline
            command: python -m compileall -q can_tcp_gateway.py can_tcp_client.py tests
          - name: Tests
            command: python -m pytest -q

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
